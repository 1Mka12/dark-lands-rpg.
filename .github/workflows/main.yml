
name: Dark Lands RPG Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Завантажити код
        uses: actions/checkout@v4

      - name: Встановити Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Перевірити проєкт
        run: godot --headless --editor --path . --quit

      - name: Зібрати Android APK
        run: |
          mkdir -p build/android
          godot --headless --path . \
            --export-debug "Android" \
            build/android/DarkLands.apk

      - name: Зберегти APK
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Lands-RPG-Android
          path: build/android/DarkLands.apk
          if-no-files-found: error
          
